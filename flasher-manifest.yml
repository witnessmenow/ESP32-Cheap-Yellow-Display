# Metadata for the ESP32-S3-Flasher wizard (https://github.com/lemio/ESP32-S3-Flasher).
# Built from platformio.ini by the `lemio/ESP32-S3-Flasher/action` GitHub Action - keys
# here are matched to environment names in platformio.ini.
#
# Most examples build once (one ILI9341_2_DRIVER firmware) and expose "Screen Rotation"
# and/or "Invert Colors" as flash-time variables instead of a separate CYD2USB build -
# see platformio.ini's header comment. The exception is the LVGL9-based examples
# (lvgl9-*, lvgl9-plus-led-*), which still ship as compile-time cyd/cyd2usb pairs since
# LVGL's tft_espi driver doesn't expose a way to call tft.invertDisplay() at runtime.

site:
  title: Cheap Yellow Display - Example Flasher
  subtitle: Flash any CYD example straight from your browser
  bootModeVideo: https://github.com/user-attachments/assets/e06bbd1f-ccc4-47cd-be45-65cba46ab892
examples:
  basics-1-helloworld:
    name: 1. Hello World
    description: Basic TFT_eSPI hello-world test.
    variables:
    - firmware_name: '|*ROTATION*|'
      readable_name: Screen Rotation
      type: enum
      options:
      - value: '0'
        label: 0°
      - value: '1'
        label: 90°
      - value: '2'
        label: 180°
      - value: '3'
        label: 270°
      default_value: '1'
      max_length: 16
    - firmware_name: '|*INVERT*|'
      readable_name: Invert Colors
      type: enum
      options:
      - value: '0'
        label: Normal (CYD)
      - value: '1'
        label: Inverted (CYD2USB)
      default_value: '0'
      max_length: 16
    recommended: true
