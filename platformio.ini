; =====================================================================================
; Alternative display libraries
; =====================================================================================
; These talk to the panel directly (no TFT_eSPI / User_Setup) and hardcode the ILI9341
; controller/init sequence used on the original CYD - since neither library exposes an
; invertDisplay()-style runtime fix the way TFT_eSPI does, these aren't flash-time
; configurable for CYD2USB; see each example's own comments/README for details.

[env:adafruit-ili9341]
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit ILI9341@^1.6.1
build_src_filter =
	+<*>
	+<../Examples/AlternativeLibraries/Adafruit_ILI9341/1-Adafruit_ILI9341_Test/*>

[env:bb-spi-lcd]
lib_deps = bitbank2/bb_spi_lcd@2.5.0
build_src_filter =
	+<*>
	+<../Examples/AlternativeLibraries/bb_spi_lcd/1-bb_spi_lcd_Test/*>

