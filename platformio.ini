; PlatformIO Project Configuration File
;
; This is a single PlatformIO project covering every Arduino-framework example in this
; repo. Each example is exactly one environment - CYD vs CYD2USB hardware isn't a build
; variant here, it's a flash-time choice: every example that talks to the display uses
; the same ILI9341_2_DRIVER build always, and exposes "Screen Rotation" and/or "Invert
; Colors" as flash-time variables (see flasher-manifest.yml) that call
; tft.setRotation()/tft.invertDisplay() at runtime. This mirrors cyd.md's documented fix
; for CYD2USB ("Invert the display at the code level using the tft.invertDisplay(1)
; method") and what Examples/Projects/RollingClock already did before this file existed -
; one driver, inversion decided at runtime, not two separately-compiled driver variants.
;
; Build a single example:   pio run -e basics-1-helloworld
; Build everything (CI):    pio run
;
; Examples that don't use PlatformIO/Arduino at all (Examples/ESP-IDF, Examples/Rust,
; Examples/Micropython, Examples/ESPHome, Examples/openHASP, Variants/3248S035C) are not
; part of this project - they use their own toolchains and are documented separately.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
extra_scripts = pre:tools/select_example_src.py
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ===== Reusable fragments =====
; Most examples use TFT_eSPI with the same CYD pin wiring and the same ILI9341_2_DRIVER
; (see the file header comment above for why there's no separate CYD2USB driver
; fragment). Examples with different wiring needs (e.g. the AlternativeLibraries
; examples that talk to the panel directly) define their own build_flags instead.

[tft_pins]
build_flags =
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF

[cyd_driver]
build_flags =
	-DILI9341_2_DRIVER

; LVGL9's lv_tft_espi_create() helper (see lvgl9_common below) creates and fully owns
; its own internal TFT_eSPI instance without exposing it back to the sketch - there's no
; public API to call tft.invertDisplay() on it, so LVGL9-based examples can't offer the
; runtime "Invert Colors" option every other example does. They keep the old compile-time
; cyd/cyd2usb split instead (see [env:lvgl9-cyd2usb]/[env:lvgl9-plus-led-cyd2usb] below).
[cyd2usb_driver]
build_flags =
	-DST7789_DRIVER
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF

