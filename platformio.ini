; SD-based NFC sniffing test - no display code, so no cyd/cyd2usb split is needed.
; witnessmenow/Seeed_Arduino_NFC (linked from the sketch's own comments) is the one
; library covering all three of this sketch's #include paths - NfcAdapter.h at its src
; root, plus the nested PN532/PN532/PN532.h and PN532/PN532_SPI/PN532_SPI.h paths.
[env:nfc-via-sd-sniffer-cyd]
lib_deps = https://github.com/witnessmenow/Seeed_Arduino_NFC.git
build_src_filter =
	+<*>
	+<../Examples/InputTests/NFCviaSDSniffer/SimpleNFCTest/*>
