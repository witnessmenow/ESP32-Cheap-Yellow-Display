; PlatformIO Project Configuration File
;
; This is a single PlatformIO project covering every Arduino-framework example in this
; repo. Each example is exposed as one or two environments (a "cyd" env for the classic
; ESP32-2432S028R and, where the example's display code supports it, a "cyd2usb" env for
; the ST7789-based two-USB variant).
;
; Build a single example:   pio run -e basics-1-helloworld-cyd
; Build everything (CI):    pio run
;
; Examples that don't use PlatformIO/Arduino at all (Examples/ESP-IDF, Examples/Rust,
; Examples/Micropython, Examples/ESPHome, Examples/openHASP, Variants/3248S035C) are not
; part of this project - they use their own toolchains and are documented separately.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
extra_scripts = pre:tools/select_example_src.py
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ===== Reusable fragments =====
; Most examples use TFT_eSPI with the same CYD pin wiring, and pick their display driver
; via one of the two fragments below. Examples with different wiring/driver needs (e.g.
; RollingClock, or the AlternativeLibraries examples that talk to the panel directly)
; define their own build_flags instead of using these.

[tft_pins]
build_flags =
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF

[cyd_driver]
build_flags =
	-DILI9341_2_DRIVER

[cyd2usb_driver]
build_flags =
	-DST7789_DRIVER
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF

