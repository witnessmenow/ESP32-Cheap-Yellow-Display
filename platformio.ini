; =====================================================================================
; LVGL
; =====================================================================================

; LVGL8 uses a real lv_conf.h (checked in at Examples/LVGL8/lv_conf.h) rather than
; -DLV_CONF_SKIP, matching the Arduino-IDE instructions in Examples/LVGL8/README.md.
; LV_CONF_INCLUDE_SIMPLE + the extra include path lets the compiler find it without
; copying it into a libraries folder the way Arduino IDE users have to. lv_conf.h has
; LV_BUILD_EXAMPLES/LV_USE_DEMO_WIDGETS on, so, like LVGL9 below, the lvgl package's
; examples/ and demos/ folders need to be pulled into the build explicitly.
[lvgl8_common]
lib_deps =
	bodmer/TFT_eSPI@^2.5.34
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
	lvgl/lvgl@^8.3.9
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
	-IExamples/LVGL8

[env:lvgl8-cyd]
lib_deps = ${lvgl8_common.lib_deps}
build_flags =
	${tft_pins.build_flags}
	${lvgl8_common.build_flags}
	${cyd_driver.build_flags}
build_src_filter =
	+<*>
	+<../Examples/LVGL8/LVGL_Arduino/*>
	+<../.pio/libdeps/${this.__env__}/lvgl/examples>
	+<../.pio/libdeps/${this.__env__}/lvgl/demos>

[env:lvgl8-cyd2usb]
lib_deps = ${lvgl8_common.lib_deps}
build_flags =
	${tft_pins.build_flags}
	${lvgl8_common.build_flags}
	${cyd2usb_driver.build_flags}
build_src_filter =
	+<*>
	+<../Examples/LVGL8/LVGL_Arduino/*>
	+<../.pio/libdeps/${this.__env__}/lvgl/examples>
	+<../.pio/libdeps/${this.__env__}/lvgl/demos>

[lvgl9_common]
lib_deps =
	lvgl/lvgl@^9.1.0
	bodmer/TFT_eSPI@^2.5.34
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
	-DLV_CONF_SKIP
	-DLV_USE_DEMO_WIDGETS
	-DLV_USE_TFT_ESPI

[env:lvgl9-cyd]
lib_deps = ${lvgl9_common.lib_deps}
